<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Mandiri Siswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-decoration">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="container">
        <div class="header-zone">
            <div class="logo-area">
                <i class="fa-solid fa-camera-retro"></i>
            </div>
            <h2>E-Presensi Siswa</h2>
            <p>Silakan gunakan pemindai kamera atau ketik NIS Anda di bawah ini</p>
        </div>

        <div class="method-selector">
            <button type="button" id="btnModeKetik" class="sub-method active"><i class="fa-solid fa-keyboard"></i> Ketik NIS</button>
            <button type="button" id="btnModeScan" class="sub-method"><i class="fa-solid fa-qrcode"></i> Scan QR</button>
        </div>
        
        <form id="formAbsen">
            <div id="zoneKetik" class="input-group">
                <label for="nisInput"><i class="fa-solid fa-id-card"></i> Nomor Induk Siswa (NIS)</label>
                <div class="search-box">
                    <input type="text" id="nisInput" placeholder="Masukkan NIS Anda...">
                    <button type="button" id="btnCari">
                        <span><i class="fa-solid fa-magnifying-glass"></i> Cari</span>
                    </button>
                </div>
            </div>

            <div id="zoneScan" class="input-group hidden">
                <label><i class="fa-solid fa-camera"></i> Kamera Pemindai QR</label>
                <div class="scanner-wrapper">
                    <div id="reader-siswa"></div>
                </div>
                <p class="scan-tip">Arahkan QR Code Kartu Pelajar Anda ke tengah kotak kamera</p>
            </div>
            
            <div id="detailSiswa" class="hidden animated-fade-in">
                <div class="card-siswa">
                    <div class="avatar-fallback">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <div class="bio-siswa">
                        <h4 id="txtNama">Nama Siswa</h4>
                        <p id="txtKelas">Kelas Siswa</p>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="statusAbsen"><i class="fa-solid fa-user-check"></i> Status Kehadiran</label>
                    <select id="statusAbsen">
                        <option value="Hadir">🟢 Hadir</option>
                        <option value="Izin">🟡 Izin</option>
                        <option value="Sakit">🔵 Sakit</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="keterangan"><i class="fa-solid fa-file-pen"></i> Keterangan (Opsional)</label>
                    <input type="text" id="keterangan" placeholder="Alasan jika izin atau sakit...">
                </div>
                
                <button type="submit" id="btnSubmit" class="btn-success">
                    <i class="fa-solid fa-paper-plane"></i> Kirim Presensi Masuk
                </button>
            </div>
        </form>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="app.js"></script>
</body>
</html>
